name: Validate BETANIA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check Python backend syntax
        run: python -m py_compile backend/main.py
      - name: Check Wan 2.2 workflow JSON
        run: python -m json.tool backend/wan2_2_5b_t2v.json > /dev/null
